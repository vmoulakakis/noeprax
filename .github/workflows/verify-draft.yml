name: Verify NOEPRAX draft changes (no deploy)
on:
  pull_request:
    paths:
      - 'styles.css'
      - 'DESIGN.md'
      - 'tests/**'
      - 'scripts/**'
      - 'runtime/**'
      - 'release/**'
      - '.github/workflows/verify-draft.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Unit tests, source verification, release output
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact pull-request code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Node runtime
        run: |
          node --version
          node -e 'if(Number(process.versions.node.split(".")[0]) < 20) process.exit(1)'
      - name: Run regression tests
        run: npm test
      - name: Verify source contracts
        run: npm run verify
      - name: Build actual V3 release (no deploy)
        run: npm run build
      - name: Inspect V3 generated HTML selector inventory for release-aware design
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const html=fs.readFileSync('public/index.html','utf8');
          const cls=[...new Set([...html.matchAll(/class=["']([^"']+)["']/g)].flatMap(x=>x[1].split(/\\s+/)).filter(Boolean))];
          const ids=[...new Set([...html.matchAll(/id=["']([^"']+)["']/g)].map(x=>x[1]))];
          console.log('V3_SELECTOR_CLASSES='+JSON.stringify(cls.slice(0,160)));
          console.log('V3_SELECTOR_IDS='+JSON.stringify(ids.slice(0,100)));
          console.log('V3_STYLESHEETS='+JSON.stringify([...html.matchAll(/<link[^>]+rel=["']stylesheet["'][^>]+>/g)].map(x=>x[0]).slice(0,12)));
          JS
      - name: Verify generated release behavior and founder links
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const html = fs.readFileSync('public/index.html','utf8');
          const assert = (b,msg) => {if (!b) throw new Error(msg)};
          assert(html.includes('<main') && html.includes('</main>'),'generated index missing main');
          assert(html.includes('noeprax-founder-synergy'),'founder section missing after v3 generation');
          assert(html.includes('https://ai-hub.vmoulakakis.chatgpt.site/'),'AI Space link missing');
          assert(html.includes('https://e-vassilios-moulakakis.blogspot.com/'),'Blogger link missing');
          assert(fs.existsSync('public/login.html'),'login missing');
          assert(fs.existsSync('public/report.html'),'report missing');
          assert(fs.existsSync('public/assets/noeprax-premium.css'),'premium CSS overlay missing');
          assert(html.includes('href="/assets/noeprax-premium.css"'),'premium stylesheet not in actual release HTML');
          assert(html.indexOf('href="/assets/site.css"') < html.indexOf('href="/assets/noeprax-premium.css"'),'premium overlay must load after V3 base CSS');
          const overlay=fs.readFileSync('public/assets/noeprax-premium.css','utf8');
          assert(overlay.includes('.router-grid .router-card'),'premium V3 selectors missing');
          console.log('Generated V3 shell and founder links verified; visual/browser QA pending.');
          JS

  browser-smoke:
    name: Browser viewport and interactions (no deploy)
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout PR code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build V3
        run: npm run build
      - name: Install pinned free Playwright browser runner
        run: |
          npm install --no-save --ignore-scripts playwright@1.59.1
          npx playwright install chromium --with-deps
      - name: Check V3 responsive DOM, CSS and interactive links
        run: node scripts/qa-v3-browser.mjs
      - name: Save screenshot proof for visual review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: noeprax-v3-responsive-review
          path: |
            noeprax-v3-390.png
            noeprax-v3-1440.png
          if-no-files-found: warn
          retention-days: 3
